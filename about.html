<!doctype html>
<html lang="zh-CN" data-mode="light" data-theme="cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="尹宜博的学历背景与公开成果档案">
  <meta name="color-scheme" content="light dark">
  <title>个人档案｜尹宜博</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body data-page="about">
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="page-wipe" aria-hidden="true"></div>
  <div class="scroll-progress" aria-hidden="true"><span id="scrollProgress"></span></div>
  <aside class="side-rail" aria-hidden="true"><span>PROFILE</span><i id="railLine"></i><span id="scrollPercent">00%</span></aside>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow hero-in">PROFILE / 个人档案</p>
        <h1 class="hero-in d1">学历背景。<span class="outline">成果档案。</span></h1>
        <p class="page-lead hero-in d2">教育经历与经过验证的公开记录。</p>
      </div>
    </section>

    <section class="education-archive-section">
      <div class="container">
        <header class="section-head reveal"><div class="section-no">EDUCATION / 学历</div><div><h2>教育背景。</h2></div></header>
        <article class="education-record reveal">
          <div class="education-record-main">
            <p>UNDERGRADUATE / 本科</p>
            <h3 id="educationSchool"></h3>
            <strong id="educationMajor"></strong>
          </div>
          <dl class="education-record-meta">
            <div><dt>就读时间</dt><dd id="educationPeriod"></dd></div>
            <div><dt>所在地</dt><dd id="educationLocation"></dd></div>
            <div><dt>状态</dt><dd id="educationStatus"></dd></div>
          </dl>
        </article>
      </div>
    </section>

    <section class="archive-section" aria-label="证书、竞赛、科研、论文与荣誉奖项">
      <div class="container">
        <div class="achievement-category-grid" id="achievementCategoryGrid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <button class="icon-btn back-top" id="backTop" type="button" aria-label="返回顶部">↑</button>
</body>
</html>
