<!doctype html>
<html lang="zh-CN" data-mode="light" data-theme="cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="尹宜博的成长记录与阶段事件">
  <meta name="color-scheme" content="light dark">
  <title>成长记录｜尹宜博</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body data-page="growth">
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="page-wipe" aria-hidden="true"></div>
  <div class="scroll-progress" aria-hidden="true"><span id="scrollProgress"></span></div>
  <aside class="side-rail" aria-hidden="true"><span>GROWTH</span><i id="railLine"></i><span id="scrollPercent">00%</span></aside>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow hero-in">GROWTH / 成长记录</p>
        <h1 class="hero-in d1">成长轨迹。<span class="outline">一件事，一条记录。</span></h1>
        <p class="page-lead hero-in d2">学习、实践、项目与阶段变化。</p>
      </div>
    </section>

    <section class="growth-log-section">
      <div class="container">
        <div class="growth-overview reveal">
          <div><strong id="growthRecordCount">00</strong><span>RECORDS</span></div>
          <p id="growthDateRange">2026—至今</p>
          <i>GROWTH LOG</i>
        </div>
        <header class="section-head reveal"><div class="section-no">01 / TIMELINE</div><div><h2>时间线。</h2></div></header>
        <div class="filter-bar reveal" id="growthFilters" aria-label="成长记录筛选"></div>
        <div class="timeline" id="timeline"><span class="timeline-fill" aria-hidden="true"></span></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <button class="icon-btn back-top" id="backTop" type="button" aria-label="返回顶部">↑</button>
</body>
</html>
